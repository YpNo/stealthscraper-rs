[package]
name = "stealthscraper-rs"
version = "1.0.0"
edition = "2024"
rust-version = "1.95"
license = "MIT"
description = "A stealthy web scraping library providing TLS JA4 fingerprint impersonation and headless browser automation."
repository = "https://github.com/ypno/stealthscraper-rs"
readme = "README.md"
keywords = ["scraping", "stealth", "tls-fingerprint", "headless-chrome", "automation"]
categories = ["web-programming::http-client", "network-programming"]
include = [
    "src/**/*.rs",
    "Cargo.toml",
    "README.md",
    "LICENSE",
    "CHANGELOG.md",
    "SECURITY.md",
]

[features]
default = []
browser = ["dep:command-fds"]
# Persistent (redb-backed) domain/session state store.
persistence = ["dep:redb"]

# Build docs.rs with all features so the `browser`-gated API is documented.
[package.metadata.docs.rs]
all-features = true

[dependencies]
http-body-util = "0.1.3"
hyper = { version = "1.9.0", features = ["server"] }
hyper-util = { version = "0.1.20", features = ["server-auto", "tokio"] }
log = "0.4.29"
rand = "0.10.1"
# BoringSSL, shared with wreq's egress leg. Pinned to the same minor version so
# cargo unifies them onto one vendored build rather than compiling two.
btls = { version = "0.5.6" }
tokio-btls = { version = "0.5.6" }
wreq = { version = "6.0.0-rc.31", default-features = false, features = ["json", "cookies", "socks", "stream", "gzip", "deflate", "brotli", "zstd", "tokio-rt"] }
serde = { version = "1.0.228", features = ["derive"] }
# Certificate-compression codecs for the TLS handshake (RFC 8879). Both are
# already in the graph via `wreq`'s response-decompression features, so naming
# them costs nothing — provided the major matches what `wreq` resolves. `brotli`
# is deliberately held at 8 although 9 exists: `wreq` -> `tower-http` ->
# `async-compression` pulls brotli 8, so moving to 9 would put two copies of the
# same codec in the graph rather than sharing one.
brotli = "8.0"
flate2 = "1.1"
sha2 = "0.11.0"
serde_json = "1.0.149"
thiserror = "2.0.18"
# `wreq` 6 no longer re-exports `Url` (it moved to `http::Uri`, which cannot edit
# userinfo). Credential redaction needs real URL surgery, so the crate is named
# directly; it is already in the graph via `wreq`, so this costs nothing.
url = "2.5"
tokio = { version = "1.52.3", features = ["rt-multi-thread", "net", "time", "macros", "signal"] }
tokio-util = { version = "0.7.18", features = ["compat"] }

# Optional dependencies for the 'browser' feature
# Maps pipe descriptors onto 3/4 for Chrome's --remote-debugging-pipe, keeping
# the required dup2 inside an audited crate so this one stays unsafe-free.
command-fds = { version = "0.3.3", optional = true }

# Optional dependency for the 'persistence' feature (pure-Rust embedded KV store).
redb = { version = "4", optional = true }

[dev-dependencies]
env_logger = "0.11.9"
mockito = "1.7.2"

